[versions]
# 图表：下载速度曲线。选它是为了**不自己画 Canvas** —— 曲线要处理缩放/坐标轴/空数据/主题配色，
# 手写等于重造一个不完整的图表库。
# 版本锁在 2.4.4：更新的版本会把 androidx.core / compose-ui 拉到需要 AGP 9.1 的版本
# （本项目 AGP 8.13）。2.4.4 依赖的 core-ktx 1.17.0 与 compose-bom 2025.12 都在本项目基线之内，
# 不会引起任何版本升级。
vico = "2.4.4"
agp = "8.13.0"
kotlin = "2.1.0"
coreKtx = "1.17.0"
lifecycleRuntimeKtx = "2.9.2"
activityCompose = "1.11.0"
composeBom = "2026.06.01"
material3Expressive = "1.5.0-alpha18"

room = "2.6.1"
ksp = "2.1.0-1.0.29"
material = "1.14.0"   # 官方 Material 主库，自带 com.google.android.material.color.utilities 包
# Markdown 渲染（GitHub README 的 GFM：表格/代码高亮/图片）。
# 0.35.0 用 Kotlin 2.1.x 编译，与本项目 Kotlin 2.1.0 兼容；0.39+ 需要 Kotlin 2.3。
markdownRenderer = "0.35.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
# 图表：下载速度曲线（不自己画 Canvas）
vico-compose = { module = "com.patrykandpatrick.vico:compose", version.ref = "vico" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }
# 原 material-color-utilities 坐标 (com.google.android.material:material-color-utilities:1.0.0) 在 Maven 上不存在。
# 官方 color.utilities 包就打包在下面这个主库里，import 无需改动。
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Expressive" }   # Material 3 Expressive 需要此 alpha，与 compose-bom 的稳定版并存
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }